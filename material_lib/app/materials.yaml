- material_id: material_20260726_155549_3
  name: ''
  prompt: 一位成熟的中国超模，骨相清晰、高颧骨、挺拔体态，具备强烈的杂志封面气场。自然质感底妆，深红棕色唇妆，极简大地色眼妆，蓬松大波浪长发在高原微风中轻轻飘动，眼神安静地望向远方地平线。身着高定象牙白真丝A字长裙，外搭深炭灰色oversized结构感羊毛绉纱披风外套，建筑感剪裁。佩戴单只暖金色雕塑耳坠，持黑色结构感皮质手拿包，穿尖头高跟短靴。模特静立于高原旷野中央，远处是连绵的雪山天际线，深蓝天空下白云流动，黄金时刻的落日从人物左后方洒下，温暖的轮廓光勾勒出人物与服装的边缘，长长的影子拖在草地上。135mm中长焦压缩将远山拉近，全身平视中心构图，地平线在画面下三分之一处，前景草穗虚焦增加层次。3800K暖金色调，低饱和大地色与深蓝色对比，轻微胶片颗粒与暗角，Velvia风格色彩。风吹动裙摆与发丝的静谧瞬间。8K超高清，自然肤质，商业杂志级精修。
